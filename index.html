<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>✨ Nuestro Cielo de Cartas ✨</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:Poppins,sans-serif;
background:#02030c;
color:white;
}

body{

background:
radial-gradient(circle at 20% 20%,rgba(103,58,183,.28),transparent 35%),
radial-gradient(circle at 80% 15%,rgba(0,188,212,.18),transparent 32%),
radial-gradient(circle at 70% 80%,rgba(233,30,99,.18),transparent 30%),
linear-gradient(#02030c,#06091b,#010204);

position:relative;

}

/*==========================
NEBULOSAS
==========================*/

.nebula{

position:absolute;
border-radius:50%;
filter:blur(90px);
opacity:.22;
animation:nebulaMove 18s ease-in-out infinite alternate;

}

.n1{

width:420px;
height:420px;
background:#8f6bff;
left:-120px;
top:-80px;

}

.n2{

width:380px;
height:380px;
background:#00bcd4;
right:-120px;
top:30%;

animation-duration:22s;

}

.n3{

width:500px;
height:500px;
background:#ff4fa3;
bottom:-180px;
left:25%;

animation-duration:26s;

}

@keyframes nebulaMove{

from{

transform:translateY(-25px) scale(1);

}

to{

transform:translateY(35px) scale(1.12);

}

}

/*==========================
ESTRELLAS PEQUEÑAS
==========================*/

.background-stars{

position:absolute;
inset:0;
overflow:hidden;

}

.background-stars span{

position:absolute;
width:2px;
height:2px;
background:white;
border-radius:50%;
animation:twinkle linear infinite;

}

@keyframes twinkle{

0%,100%{

opacity:.15;
transform:scale(1);

}

50%{

opacity:1;
transform:scale(2);

}

}

/*==========================
ESTRELLAS FUGACES
==========================*/

.shooting{

position:absolute;
width:170px;
height:2px;

background:linear-gradient(90deg,#fff,transparent);

opacity:0;

transform:rotate(-30deg);

animation:shoot 8s linear infinite;

}

.s2{

animation-delay:3s;

}

.s3{

animation-delay:6s;

}

@keyframes shoot{

0%{

opacity:0;
transform:translate(-250px,-180px) rotate(-30deg);

}

10%{

opacity:1;

}

35%{

opacity:0;
transform:translate(1400px,850px) rotate(-30deg);

}

100%{

opacity:0;

}

}

/*==========================
CONTENIDO
==========================*/

.container{

position:relative;
z-index:5;

width:100%;
height:100%;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

padding:30px;

}

h1{

font-family:Cinzel,serif;

font-size:clamp(32px,5vw,60px);

letter-spacing:2px;

text-align:center;

text-shadow:

0 0 12px rgba(255,255,255,.45),
0 0 30px rgba(140,120,255,.5);

margin-bottom:10px;

}

.subtitle{

font-size:clamp(14px,2vw,20px);

opacity:.85;

margin-bottom:50px;

text-align:center;

}

/*==========================
CIELO
==========================*/

.sky{

position:relative;

width:min(1200px,95vw);

height:min(72vh,850px);

}

/*==========================
ESTRELLAS GRANDES
==========================*/

.star{

position:absolute;

width:70px;
height:70px;

display:flex;
justify-content:center;
align-items:center;

cursor:pointer;

user-select:none;

transition:.35s;

animation:float 4s ease-in-out infinite;

}

.star:nth-child(even){

animation-duration:5.5s;

}

.star:nth-child(3n){

animation-duration:6.2s;

}

.star::before{

content:"⭐";

font-size:46px;

filter:
drop-shadow(0 0 10px rgba(255,255,255,.4));

transition:.35s;

}

.star.locked::before{

opacity:.45;
filter:grayscale(1);

}

.star.unlocked::before{

animation:pulse 2.3s infinite;

}

.star:hover{

transform:scale(1.12);

}

.lock{

position:absolute;

bottom:-4px;
right:-2px;

font-size:18px;

background:#111827;

border-radius:50%;

padding:3px;

box-shadow:0 0 10px rgba(0,0,0,.4);

}

.glow{

position:absolute;

width:100%;
height:100%;

border-radius:50%;

background:radial-gradient(circle,
rgba(255,255,255,.55),
transparent 70%);

filter:blur(12px);

opacity:0;

animation:shine 2.5s infinite;

pointer-events:none;

}

.star.locked .glow{

display:none;

}

@keyframes shine{

0%,100%{

opacity:.3;
transform:scale(.9);

}

50%{

opacity:1;
transform:scale(1.25);

}

}

@keyframes pulse{

0%,100%{

transform:scale(1);

}

50%{

transform:scale(1.12);

}

}

@keyframes float{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-12px);

}

}

/* Continúa en la Parte 2... */

<style>

/*==========================
VENTANA MODAL
==========================*/

.modal{

position:fixed;
inset:0;

background:rgba(0,0,0,.82);
backdrop-filter:blur(8px);

display:flex;
justify-content:center;
align-items:center;

opacity:0;
visibility:hidden;

transition:.35s;

z-index:9999;

}

.modal.active{

opacity:1;
visibility:visible;

}

.card{

width:min(92vw,540px);

background:rgba(10,12,30,.95);

border:1px solid rgba(255,255,255,.08);

border-radius:28px;

padding:35px 28px;

box-shadow:
0 0 40px rgba(110,80,255,.35),
0 0 120px rgba(0,0,0,.5);

text-align:center;

animation:popup .35s ease;

}

@keyframes popup{

from{

transform:scale(.85);
opacity:0;

}

to{

transform:scale(1);
opacity:1;

}

}

.card h2{

font-family:Cinzel,serif;

font-size:28px;

margin-bottom:14px;

}

.card p{

line-height:1.7;

opacity:.88;

margin-bottom:24px;

}

.openButton{

display:inline-flex;
align-items:center;
justify-content:center;

padding:15px 34px;

border:none;

border-radius:999px;

font-size:16px;

font-weight:600;

cursor:pointer;

background:linear-gradient(135deg,#9b7cff,#5e8dff);

color:white;

transition:.3s;

box-shadow:0 0 25px rgba(140,120,255,.4);

text-decoration:none;

}

.openButton:hover{

transform:translateY(-2px);

box-shadow:0 0 40px rgba(140,120,255,.7);

}

.close{

margin-top:20px;

background:none;

border:none;

color:#cfcfcf;

font-size:15px;

cursor:pointer;

}

/*==========================
RESPONSIVE
==========================*/

@media(max-width:700px){

.star{

width:56px;
height:56px;

}

.star::before{

font-size:38px;

}

.lock{

font-size:15px;

}

.sky{

height:68vh;

}

}

</style>

</head>

<body>

<div class="nebula n1"></div>
<div class="nebula n2"></div>
<div class="nebula n3"></div>

<div class="background-stars" id="backgroundStars"></div>

<div class="shooting" style="top:12%;left:-200px;"></div>
<div class="shooting s2" style="top:38%;left:-250px;"></div>
<div class="shooting s3" style="top:65%;left:-180px;"></div>

<div class="container">

<h1>Nuestro Cielo de Cartas</h1>

<p class="subtitle">
Cada estrella guarda un pedacito de mi corazón.
</p>

<div class="sky" id="sky"></div>

</div>

<div class="modal" id="modal">

<div class="card">

<h2 id="tituloCarta"></h2>

<p id="textoCarta"></p>

<a
id="abrirCarta"
class="openButton"
target="_blank">

Abrir Carta ✨

</a>

<br>

<button
class="close"
onclick="cerrarModal()">

Cerrar

</button>

</div>

</div>

<script>

/*=========================================
CONFIGURACIÓN
=========================================*/

const ESTRELLAS_DESBLOQUEADAS = 0;

const CARTAS = [

"",
"",
"",
"",
"",
"",
"",
"",
"",
"",

"",
"",
"",
"",
"",
"",
"",
"",
"",
"",

"",
"",
"",
"",
"",
"",
"",
"",
"",
""

];

/*=========================================
POSICIONES
=========================================*/

const POSICIONES=[

[8,10],
[24,8],
[42,12],
[63,9],
[82,14],

[12,28],
[30,25],
[48,30],
[66,26],
[86,31],

[6,48],
[22,46],
[40,49],
[58,46],
[78,50],

[14,67],
[32,66],
[50,69],
[68,65],
[86,68],

[8,86],
[24,84],
[42,88],
[58,83],
[74,86],

[90,84],
[52,8],
[72,42],
[36,73],
[90,55]

];

/* Continúa en la Parte 3... */

/*=========================================
REFERENCIAS
=========================================*/

const sky=document.getElementById("sky");
const modal=document.getElementById("modal");
const titulo=document.getElementById("tituloCarta");
const texto=document.getElementById("textoCarta");
const boton=document.getElementById("abrirCarta");

/*=========================================
CREAR ESTRELLAS DEL FONDO
=========================================*/

const fondo=document.getElementById("backgroundStars");

for(let i=0;i<180;i++){

const s=document.createElement("span");

s.style.left=Math.random()*100+"%";
s.style.top=Math.random()*100+"%";

const tam=Math.random()*3+1;

s.style.width=tam+"px";
s.style.height=tam+"px";

s.style.animationDuration=(2+Math.random()*5)+"s";
s.style.animationDelay=(Math.random()*5)+"s";

fondo.appendChild(s);

}

/*=========================================
CREAR LAS 30 ESTRELLAS
=========================================*/

POSICIONES.forEach((p,index)=>{

const estrella=document.createElement("div");

estrella.className="star";

if(index<ESTRELLAS_DESBLOQUEADAS){

estrella.classList.add("unlocked");

}else{

estrella.classList.add("locked");

}

estrella.style.left=p[0]+"%";
estrella.style.top=p[1]+"%";

estrella.style.transform="translate(-50%,-50%)";

const glow=document.createElement("div");
glow.className="glow";

estrella.appendChild(glow);

if(index>=ESTRELLAS_DESBLOQUEADAS){

const lock=document.createElement("div");
lock.className="lock";
lock.innerHTML="🔒";
estrella.appendChild(lock);

}

estrella.onclick=()=>abrirCarta(index);

sky.appendChild(estrella);

});

/*=========================================
ABRIR CARTA
=========================================*/

function abrirCarta(numero){

if(numero>=ESTRELLAS_DESBLOQUEADAS){

titulo.innerHTML="⭐ Estrella Bloqueada";

texto.innerHTML=
"Esta estrella todavía permanece cerrada.<br><br>Regresa cuando llegue el momento de descubrir el siguiente pedacito de mi corazón.";

boton.style.display="none";

modal.classList.add("active");

return;

}

titulo.innerHTML="✨ Carta "+(numero+1);

texto.innerHTML=
"Esta estrella ya puede abrirse.<br><br>Pulsa el botón para leer la carta.";

boton.style.display="inline-flex";

if(CARTAS[numero].trim()===""){

boton.removeAttribute("href");

boton.onclick=function(){

alert("Aún no has agregado el enlace de esta carta.");

};

}else{

boton.href=CARTAS[numero];

boton.onclick=null;

}

modal.classList.add("active");

}

/*=========================================
CERRAR MODAL
=========================================*/

function cerrarModal(){

modal.classList.remove("active");

}

modal.addEventListener("click",e=>{

if(e.target===modal){

cerrarModal();

}

});

/*=========================================
ESC PARA CERRAR
=========================================*/

document.addEventListener("keydown",e=>{

if(e.key==="Escape"){

cerrarModal();

}

});

/*=========================================
EFECTO PARALLAX SUAVE
=========================================*/

document.addEventListener("mousemove",e=>{

const x=(e.clientX/window.innerWidth-.5)*10;
const y=(e.clientY/window.innerHeight-.5)*10;

document.querySelectorAll(".nebula").forEach((n,i)=>{

const f=(i+1)*0.8;

n.style.transform=
`translate(${x*f}px,${y*f}px)`;

});

});

/*=========================================
FIN DEL ARCHIVO
=========================================*/

</script>

</body>
</html>
