/* CIELO */

#universo{

    position:relative;
    width:100%;
    height:100%;

    overflow:hidden;

}


/* NEBULOSAS */

.nebulosa{

    position:absolute;
    border-radius:50%;
    filter:blur(100px);
    opacity:.35;

}


.n1{

    width:450px;
    height:450px;
    background:#7c4dff;
    top:-150px;
    left:-100px;

}


.n2{

    width:500px;
    height:500px;
    background:#00bcd4;
    right:-150px;
    bottom:-100px;

}


.n3{

    width:350px;
    height:350px;
    background:#ff4081;
    left:35%;
    top:40%;

}



/* ESTRELLAS PEQUEÑAS DEL FONDO */

.fondo-estrellas span{

    position:absolute;

    width:3px;
    height:3px;

    background:white;
    border-radius:50%;

    animation:brillar 3s infinite alternate;

}


@keyframes brillar{

    from{
        opacity:.2;
        transform:scale(.7);
    }

    to{
        opacity:1;
        transform:scale(1.8);
    }

}



/* CONTENIDO CENTRAL */

.contenido{
    
    pointer-events:none;
    position:absolute;
    z-index:5;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:90%;
    max-width:700px;

    text-align:center;

}


h1{

    font-size:clamp(32px,6vw,65px);

    font-family:Georgia,serif;

    letter-spacing:3px;

    text-shadow:
    0 0 15px #fff,
    0 0 35px #9b7cff;

}



.mensaje{

    margin-top:25px;

    padding:25px;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.2);

    border-radius:25px;

    backdrop-filter:blur(12px);

    line-height:1.8;

    font-size:18px;
    
    pointer-events:none;


}



/* ZONA DE CONSTELACIÓN */

#constelacion{

    position:absolute;

    inset:0;

    z-index:6;
        
    pointer-events:auto;

}



/* ESTRELLAS DE CARTAS */

.estrella{

    position:absolute;

    width:55px;
    height:55px;

    display:flex;

    justify-content:center;
    align-items:center;

    cursor:pointer;

    transition:.4s;

}


.estrella::before{

    content:"★";

    font-size:42px;

    color:#777;

}


.estrella.bloqueada::after{

    content:"🔒";

    position:absolute;

    font-size:18px;

    bottom:-5px;

    right:-5px;

}



.estrella.desbloqueada::before{

    color:#ffe88a;

    text-shadow:
    0 0 10px #fff,
    0 0 30px #ffd54f,
    0 0 60px #ff9800;

    animation:latido 2s infinite;

}



@keyframes latido{

    50%{

        transform:scale(1.25);

    }

}



/* VARIABLES */

</style>

function abrirEstrella(numero){

numero < ESTRELLAS_DESBLOQUEADAS;

document.getElementById("tituloCarta");


const contenido =
document.getElementById("contenidoCarta");


const boton =

tituloCarta.innerHTML=
"🔒 Esta estrella duerme";


contenido.innerHTML=

`

Pero incluso las estrellas que esperan
siguen formando parte de nuestra historia.

✨
`;



boton.style.display="none";



}else{



tituloCarta.innerHTML=
"⭐ Carta número "+(numero+1);



contenido.innerHTML=

`
Esta estrella guarda un pedacito
de nuestro amor.

Pulsa el botón para descubrirlo.
`;



if(CARTAS[numero] !== ""){


boton.href=CARTAS[numero];

boton.style.display="inline-block";


}else{


boton.style.display="none";


}



caminoDeLuz(estrellas[numero]);

setTimeout(()=>{

    modal.classList.add("activo");

},1200);

return;


}



}

    /*========================================
  CAMINO DE LUZ
========================================*/

function caminoDeLuz(estrella){

    const universo =
    document.getElementById("universo");

    const rect =
    estrella.getBoundingClientRect();

    const inicioX =
    rect.left + rect.width / 2;

    const inicioY =
    rect.top + rect.height / 2;

    const destinoX =
    window.innerWidth / 2;

    const destinoY =
    window.innerHeight / 2;

    const viajera =
    document.createElement("div");

    viajera.style.position="fixed";

    viajera.style.left=inicioX+"px";
    viajera.style.top=inicioY+"px";

    viajera.style.width="9px";
    viajera.style.height="9px";

    viajera.style.borderRadius="50%";

    viajera.style.background="#fff";

    viajera.style.boxShadow=
    "0 0 8px #fff,"+
    "0 0 20px #FFD54F,"+
    "0 0 40px #FFD54F";

    viajera.style.zIndex="150";

    viajera.style.pointerEvents="none";

    document.body.appendChild(viajera);


    /* Estela */

    const estela =
    document.createElement("div");

    estela.style.position="fixed";

    estela.style.left=inicioX+"px";
    estela.style.top=inicioY+"px";

    estela.style.width="80px";
    estela.style.height="2px";

    estela.style.transformOrigin="left center";

    estela.style.background=
    "linear-gradient(90deg,#fff,transparent)";

    estela.style.boxShadow=
    "0 0 10px #FFD54F";

    estela.style.zIndex="149";

    estela.style.pointerEvents="none";

    document.body.appendChild(estela);


    const dx=destinoX-inicioX;
    const dy=destinoY-inicioY;

    const distancia=
    Math.sqrt(dx*dx+dy*dy);

    const angulo=
    Math.atan2(dy,dx)*180/Math.PI;


    estela.style.transform=
    `rotate(${angulo}deg)`;


    const movimiento =
    viajera.animate([

        {
            transform:"translate(0,0) scale(1)",
            opacity:1
        },

        {
            transform:
            `translate(${dx}px,${dy}px) scale(1.5)`,
            opacity:1
        },

        {
            transform:
            `translate(${dx}px,${dy}px) scale(3)`,
            opacity:0
        }

    ],{

        duration:
        Math.min(2200,Math.max(900,distancia*2)),

        easing:"cubic-bezier(.22,.61,.36,1)"

    });


    estela.animate([

        {
            opacity:0,
            transform:
            `rotate(${angulo}deg) scaleX(.1)`
        },

        {
            opacity:.8,
            transform:
            `rotate(${angulo}deg) scaleX(1)`
        },

        {
            opacity:0,
            transform:
            `rotate(${angulo}deg) scaleX(.2)`
        }

    ],{

        duration:1700,
        easing:"ease-in-out"

    });


    movimiento.onfinish=()=>{

        crearDestelloCentral(
            destinoX,
            destinoY
        );

        viajera.remove();
        estela.remove();

    };

}

function enfocarEstrella(estrella){

    const lineas =
    document.querySelectorAll("svg line");


    /* Atenuar todas las estrellas */

    todasLasEstrellas.forEach(e=>{

        e.classList.add("estrella-atenuada");

    });


    /* Atenuar las líneas */

    lineas.forEach(linea=>{

        linea.classList.add("linea-atenuada");

    });


    /* Destacar la elegida */

    estrella.classList.add("estrella-protagonista");


    /* Partículas especiales */

    for(let i=0;i<12;i++){

        setTimeout(()=>{

            crearParticulaProtagonista(
                estrella
            );

        },i*35);

    }

    particula.style.position="fixed";

    particula.style.left=
    (rect.left+rect.width/2)+"px";

    particula.style.top=
    (rect.top+rect.height/2)+"px";


    particula.style.width="4px";
    particula.style.height="4px";

    particula.style.borderRadius="50%";

    particula.style.background="#fff";

    particula.style.boxShadow=
    "0 0 8px white, 0 0 18px #FFD54F";

    particula.style.pointerEvents="none";

    particula.style.zIndex="160";


    document.body.appendChild(particula);


    const x =
    (Math.random()-.5)*100;

    const y =
    (Math.random()-.5)*100;


    particula.animate([

        {
            transform:"translate(-50%,-50%) scale(.5)",
            opacity:0
        },

        {
            transform:"translate(-50%,-50%) scale(1)",
            opacity:1
        },

        {
            transform:
            `translate(calc(-50% + ${x}px),
                       calc(-50% + ${y}px)) scale(0)`,
            opacity:0
        }

    ],{

        duration:900,

        easing:"ease-out"

    });


    setTimeout(()=>{

        particula.remove();

    },900);

function latidoSecreto(){

    const desbloqueadas =
    [...document.querySelectorAll(
        ".estrella.desbloqueada"
    )];

    if(!desbloqueadas.length){
        return;
    }

    const elegida =
    desbloqueadas[
        Math.floor(
            Math.random() *
            desbloqueadas.length
        )
    ];


    /* Mensaje */

    const mensaje =
    document.createElement("div");

    mensaje.className =
    "mensajeLatido";

    mensaje.innerHTML = `
        <span>✦</span>
        El universo acaba de recordar
        una razón para amarte
        <span>✦</span>
    `;


    document
    .getElementById("universo")
    .appendChild(mensaje);


    /* Hacer que la estrella elegida
       tenga un brillo especial */

    elegida.classList.add(
        "latido-secreto"
    );


    /* Crear pequeño resplandor */

    const resplandor =
    document.createElement("div");

    resplandor.className =
    "resplandorLatido";

    elegida.appendChild(
        resplandor
    );


    /* Quitar después */

    setTimeout(()=>{

        mensaje.classList.add(
            "desaparecerLatido"
        );

        elegida.classList.remove(
            "latido-secreto"
        );

        setTimeout(()=>{

            mensaje.remove();
            resplandor.remove();

        },1200);

    },5000);

}


/* Primera aparición */

setTimeout(()=>{

    latidoSecreto();

},12000);


/* Después aparece periódicamente */

setInterval(()=>{

    latidoSecreto();

},30000);

/*========================================
  ABRIR MAPA
========================================*/

botonMapa.addEventListener(
"click",
()=>{

    mapaCielo.classList.add(
        "activo"
    );

});


/*========================================
  CERRAR MAPA
========================================*/

document
.getElementById("cerrarMapa")
.addEventListener(
"click",
()=>{

    mapaCielo.classList.remove(
        "activo"
    );

});


mapaCielo.addEventListener(
"click",
(e)=>{

    if(e.target === mapaCielo){

        mapaCielo.classList.remove(
            "activo"
        );

    }

});


/*========================================
  ❤️ PEQUEÑO SECRETO DEL MAPA
========================================*/

let toquesMapa = 0;

const secreto =
document.getElementById(
    "secretoMapa"
);


secreto.addEventListener(
"click",
()=>{

    toquesMapa++;


    if(
        toquesMapa >= 10
    ){

        toquesMapa = 0;


        const revelacion =
        document.createElement("div");

        revelacion.className =
        "revelacionMapa";


        revelacion.innerHTML = `

            <div>

                <div
                class="corazon-revelacion">
                    ❤️
                </div>

                <p>
                    Encontraste un rincón
                    que no estaba destinado
                    a encontrarse tan fácilmente.
                </p>

                <strong>
                    Te amo. ✦
                </strong>

                <button>
                    Cerrar
                </button>

            </div>

        `;


        document.body.appendChild(
            revelacion
        );


        revelacion
        .querySelector("button")
        .onclick=()=>{

            revelacion.remove();

        };

    }

});


/*========================================
  ESTILO DE LA REVELACIÓN
========================================*/

const estiloRevelacion =
document.createElement("style");
