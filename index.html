<!DOCTYPE html>

<title>✦ La Constelación de Nuestro Amor ✦</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    width:100%;
    height:100vh;
    overflow:hidden;

    background:
    radial-gradient(circle at top,#17113b,#050512 60%,#000);

    color:white;
    font-family:"Segoe UI",sans-serif;

}


/* CIELO */

#universo{

    position:relative;
    width:100%;
    height:100%;

    overflow:hidden;

}


/* NEBULOSAS */

.nebulosa{

    position:absolute;
    border-radius:50%;
    filter:blur(100px);
    opacity:.35;

}


.n1{

    width:450px;
    height:450px;
    background:#7c4dff;
    top:-150px;
    left:-100px;

}


.n2{

    width:500px;
    height:500px;
    background:#00bcd4;
    right:-150px;
    bottom:-100px;

}


.n3{

    width:350px;
    height:350px;
    background:#ff4081;
    left:35%;
    top:40%;

}



/* ESTRELLAS PEQUEÑAS DEL FONDO */

.fondo-estrellas span{

    position:absolute;

    width:3px;
    height:3px;

    background:white;
    border-radius:50%;

    animation:brillar 3s infinite alternate;

}


@keyframes brillar{

    from{
        opacity:.2;
        transform:scale(.7);
    }

    to{
        opacity:1;
        transform:scale(1.8);
    }

}



/* CONTENIDO CENTRAL */

.contenido{
    
    pointer-events:none;
    position:absolute;
    z-index:5;

    top:50%;
    left:50%;

    transform:translate(-50%,-50%);

    width:90%;
    max-width:700px;

    text-align:center;

}


h1{

    font-size:clamp(32px,6vw,65px);

    font-family:Georgia,serif;

    letter-spacing:3px;

    text-shadow:
    0 0 15px #fff,
    0 0 35px #9b7cff;

}



.mensaje{

    margin-top:25px;

    padding:25px;

    background:rgba(255,255,255,.08);

    border:1px solid rgba(255,255,255,.2);

    border-radius:25px;

    backdrop-filter:blur(12px);

    line-height:1.8;

    font-size:18px;
    
    pointer-events:none;


}



/* ZONA DE CONSTELACIÓN */

#constelacion{

    position:absolute;

    inset:0;

    z-index:6;
        
    pointer-events:auto;

}



/* ESTRELLAS DE CARTAS */

.estrella{

    position:absolute;

    width:55px;
    height:55px;

    display:flex;

    justify-content:center;
    align-items:center;

    cursor:pointer;

    transition:.4s;

}


.estrella::before{

    content:"★";

    font-size:42px;

    color:#777;

}


.estrella.bloqueada::after{

    content:"🔒";

    position:absolute;

    font-size:18px;

    bottom:-5px;

    right:-5px;

}



.estrella.desbloqueada::before{

    color:#ffe88a;

    text-shadow:
    0 0 10px #fff,
    0 0 30px #ffd54f,
    0 0 60px #ff9800;

    animation:latido 2s infinite;

}



@keyframes latido{

    50%{

        transform:scale(1.25);

    }

}



/* VARIABLES */

</style>

</head>

/*========================================
  ABRIR ESTRELLA
========================================*/


function abrirEstrella(numero){



const desbloqueada =
numero < ESTRELLAS_DESBLOQUEADAS;



const tituloCarta =
document.getElementById("tituloCarta");


const contenido =
document.getElementById("contenidoCarta");


const boton =
document.getElementById("botonCarta");



if(!desbloqueada){



tituloCarta.innerHTML=
"🔒 Esta estrella duerme";


contenido.innerHTML=

`
Todavía no ha llegado su momento.

Pero incluso las estrellas que esperan
siguen formando parte de nuestra historia.

✨
`;



boton.style.display="none";



}else{



tituloCarta.innerHTML=
"⭐ Carta número "+(numero+1);



contenido.innerHTML=

`
Esta estrella guarda un pedacito
de nuestro amor.

Pulsa el botón para descubrirlo.
`;



if(CARTAS[numero] !== ""){


boton.href=CARTAS[numero];

boton.style.display="inline-block";


}else{


boton.style.display="none";


}



crearDestello(
estrellas[numero]
);



}



modal.classList.add("activo");



}





/*========================================
  CERRAR CARTA
========================================*/


document
.getElementById("cerrarCarta")
.onclick=()=>{


modal.classList.remove("activo");


};




modal.onclick=(e)=>{


if(e.target===modal){


modal.classList.remove("activo");


}


};





/*========================================
  DESTELLO AL DESCUBRIR ESTRELLA
========================================*/


function crearDestello(elemento){


const luz =
document.createElement("div");



luz.style.position="absolute";

luz.style.width="150px";

luz.style.height="150px";


luz.style.borderRadius="50%";


luz.style.background=
"radial-gradient(circle,white,transparent)";


luz.style.pointerEvents="none";


luz.style.transform=
"translate(-50%,-50%)";



const rect =
elemento.getBoundingClientRect();



luz.style.left =
rect.left+"px";


luz.style.top =
rect.top+"px";



luz.style.zIndex="20";



document.body.appendChild(luz);



luz.animate([

{

opacity:1,

transform:
"scale(.3)"

},

{

opacity:0,

transform:
"scale(2)"

}

],{


duration:900

});



setTimeout(()=>{

luz.remove();

},900);



  }

  
/*========================================
  EFECTO DE ESCRITURA DEL MENSAJE
========================================*/


const mensajeOriginal =

`Hay quienes miran las estrellas buscando deseos...

Yo construí una constelación para guardar cada instante,
cada sonrisa y cada pedacito de nuestro amor.

Cada estrella tiene una historia esperando ser descubierta.

Porque incluso el universo sabe que algunas cosas
merecen esperar el momento perfecto. ✨`;

const textoEscritura =
document.getElementById("textoEscritura");

if(posicionTexto < mensajeOriginal.length){


textoEscritura.innerHTML +=

.replace("\n","<br>");

/*========================================
  PARTÍCULAS ALREDEDOR DE ESTRELLAS
========================================*/


function crearParticulas(estrella){


for(let i=0;i<8;i++){


const particula =
document.createElement("span");



particula.style.position="absolute";

particula.style.width="5px";

particula.style.height="5px";


particula.style.background="#ffe88a";


particula.style.borderRadius="50%";


particula.style.pointerEvents="none";


const rect =
estrella.getBoundingClientRect();



particula.style.left =
rect.left+25+"px";


particula.style.top =
rect.top+25+"px";


particula.style.zIndex="50";



document.body.appendChild(particula);



const x =
(Math.random()-0.5)*120;


const y =
(Math.random()-0.5)*120;



particula.animate([

{

transform:"translate(0,0)",

opacity:1

},

{

transform:
`translate(${x}px,${y}px)`,

opacity:0

}

],{


duration:1200,

easing:"ease-out"


});



setTimeout(()=>{

particula.remove();

},1200);



}



}





/* Añadir partículas cuando una estrella

}

    /*========================================
  LATIDO DE LA CONSTELACIÓN
========================================*/

function latidoConstelacion(){

    const lineas =
    document.querySelectorAll("svg line");

    lineas.forEach((linea,i)=>{

        setTimeout(()=>{

            linea.animate([

                {
                    stroke:"#FFD54F",
                    strokeWidth:1.5,
                    opacity:.45
                },

                {
                    stroke:"#FFF7B2",
                    strokeWidth:3,
                    opacity:1
                },

                {
                    stroke:"#FFD54F",
                    strokeWidth:1.5,
                    opacity:.45
                }

            ],{

                duration:1800,
                easing:"ease-in-out"

            });

        },i*35);

    });



    document.querySelectorAll(".estrella.desbloqueada")
    .forEach((estrella,i)=>{

        setTimeout(()=>{

            estrella.animate([

                {

                    transform:"scale(1)",

                    filter:"drop-shadow(0 0 8px gold)"

                },

                {

                    transform:"scale(1.18)",

                    filter:"drop-shadow(0 0 30px white)"

                },

                {

                    transform:"scale(1)",

                    filter:"drop-shadow(0 0 8px gold)"

                }

            ],{

                duration:1800

            });

        },i*40);

    });

}

setInterval(()=>{

    latidoConstelacion();

},10000);

    /*========================================
  POLVO DE ESTRELLAS
========================================*/

function crearPolvo(estrella){

    const particula=document.createElement("div");

    particula.style.position="absolute";
    particula.style.width="4px";
    particula.style.height="4px";
    particula.style.borderRadius="50%";
    particula.style.background="#fff7b0";
    particula.style.pointerEvents="none";
    particula.style.left="50%";
    particula.style.top="50%";
    particula.style.boxShadow="0 0 8px #fff";

    estrella.appendChild(particula);

    const angulo=Math.random()*360;
    const distancia=18+Math.random()*12;

    particula.animate([
        {
            transform:"translate(-50%,-50%) rotate(0deg) translateX("+distancia+"px)",
            opacity:0
        },
        {
            opacity:1
        },
        {
            transform:"translate(-50%,-50%) rotate(360deg) translateX("+distancia+"px)",
            opacity:0
        }
    ],{

        duration:3000+Math.random()*2000,
        iterations:Infinity

    });

}

document.querySelectorAll(".estrella.desbloqueada")
.forEach(e=>{

    for(let i=0;i<3;i++){

        crearPolvo(e);

    }

});
